# Use case configuration for Xiaomi 11 Lite 5G NE (lisa)
# Audio path: PRI_MI2S_RX -> NXP TFA9873 (earpiece @0x34 / speaker @0x35)

SectionVerb {
	EnableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 1"
	]

	DisableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Stereo Speakers (top earpiece + bottom loudspeaker)"

	Value {
		PlaybackChannels 2
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixer "default:${CardId}"
	}
}

SectionDevice."Earpiece" {
	Comment "Earpiece (top TFA9873)"

	Value {
		PlaybackChannels 1
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixer "default:${CardId}"
	}
}
