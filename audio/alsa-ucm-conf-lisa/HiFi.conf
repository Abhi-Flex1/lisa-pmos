# Use case configuration for Xiaomi 11 Lite 5G NE (lisa)
# Playback: PRI_MI2S_RX -> NXP TFA9873 (earpiece @0x34 / speaker @0x35)
# Capture:  WCD9385 analog AMICs -> TX_CODEC_DMA_TX_3 -> MultiMedia3 (hw:0,2)

SectionVerb {
	EnableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1"
	]

	DisableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Stereo Speakers (top earpiece + bottom loudspeaker)"

	Value {
		PlaybackChannels 2
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
}

SectionDevice."Mic" {
	Comment "Built-in Microphones (main/top/back) + headset mic"

	EnableSequence [
		# WCD9385 TX decimators -> SoundWire
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX DEC1 MUX' SWR_MIC"
		cset "name='TX DEC2 MUX' SWR_MIC"
		cset "name='TX DEC3 MUX' SWR_MIC"

		# LPASS v9: WCD ADC1..4 arrive on SWR_ADC0..3.
		# Main=ADC1, headset=ADC2, back=ADC3, top=ADC4
		cset "name='TX SMIC MUX0' ADC0"
		cset "name='TX SMIC MUX1' ADC1"
		cset "name='TX SMIC MUX2' ADC2"
		cset "name='TX SMIC MUX3' ADC3"

		cset "name='ADC1_MIXER Switch' 1"
		cset "name='ADC2_MIXER Switch' 1"
		cset "name='ADC3_MIXER Switch' 1"
		cset "name='ADC4_MIXER Switch' 1"
		cset "name='ADC1 Switch' 1"
		cset "name='ADC2 Switch' 1"
		cset "name='ADC3 Switch' 1"
		cset "name='ADC4 Switch' 1"
		cset "name='ADC2 MUX' INP2"
		cset "name='HDR12 MUX' NO_HDR12"
		cset "name='HDR34 MUX' NO_HDR34"

		cset "name='ADC1 Volume' 12"
		cset "name='ADC2 Volume' 12"
		cset "name='ADC3 Volume' 12"
		cset "name='ADC4 Volume' 12"

		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_AIF1_CAP Mixer DEC1' 1"
		cset "name='TX_AIF1_CAP Mixer DEC2' 1"
		cset "name='TX_AIF1_CAP Mixer DEC3' 1"
		cset "name='TX_DEC0 Volume' 124"
		cset "name='TX_DEC1 Volume' 124"
		cset "name='TX_DEC2 Volume' 124"
		cset "name='TX_DEC3 Volume' 124"
	]

	DisableSequence [
		cset "name='TX DEC0 MUX' ZERO"
		cset "name='TX DEC1 MUX' ZERO"
		cset "name='TX DEC2 MUX' ZERO"
		cset "name='TX DEC3 MUX' ZERO"
		cset "name='TX SMIC MUX0' ZERO"
		cset "name='TX SMIC MUX1' ZERO"
		cset "name='TX SMIC MUX2' ZERO"
		cset "name='TX SMIC MUX3' ZERO"
		cset "name='ADC1_MIXER Switch' 0"
		cset "name='ADC2_MIXER Switch' 0"
		cset "name='ADC3_MIXER Switch' 0"
		cset "name='ADC4_MIXER Switch' 0"
		cset "name='ADC1 Switch' 0"
		cset "name='ADC2 Switch' 0"
		cset "name='ADC3 Switch' 0"
		cset "name='ADC4 Switch' 0"
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX_AIF1_CAP Mixer DEC1' 0"
		cset "name='TX_AIF1_CAP Mixer DEC2' 0"
		cset "name='TX_AIF1_CAP Mixer DEC3' 0"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},2"
		CaptureChannels 2
	}
}
