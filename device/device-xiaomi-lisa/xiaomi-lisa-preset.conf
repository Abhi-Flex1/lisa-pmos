[Device]
name=Xiaomi 11 Lite 5G NE

# Default for orientations without a top punch-hole cutout (CCW landscape, upside-down).
[Panels]
statusBarHeight=80
leftPadding=16
rightPadding=16

# Portrait: top-left punch-hole (Plasma Mobile maps rightPadding to the left status-bar edge).
[Panels][Bottom]
statusBarHeight=134
leftPadding=16
rightPadding=136

# Clockwise landscape: selfie punch-hole moves to top-right.
[Panels][Right]
statusBarHeight=96
leftPadding=136
rightPadding=16
