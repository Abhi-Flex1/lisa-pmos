[Device]
name=Xiaomi 11 Lite 5G NE

# Portrait (WhenOnTop / WhenOnBottom): top-left punch-hole (Plasma Mobile maps rightPadding to the left status-bar edge).
[Panels]
statusBarHeight=134
leftPadding=16
rightPadding=136

# Clockwise landscape: selfie punch-hole moves to top-right.
[Panels][Right]
statusBarHeight=96
leftPadding=136
rightPadding=16

# Counter-clockwise landscape: no top punch-hole cutout.
[Panels][Left]
statusBarHeight=80
leftPadding=16
rightPadding=16
