# On Plasma Mobile (Wayland), start-pulseaudio-x11 blocks indefinitely trying
# to connect to the lazy XWayland socket (@/tmp/.X11-unix/X0), hanging
# PulseAudio for all clients (browser audio, volume buttons, callaudiod).
[Service]
Type=forking
ExecStart=
ExecStart=/usr/bin/pulseaudio --start --log-target=syslog
UnsetEnvironment=DISPLAY
