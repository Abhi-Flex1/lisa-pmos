monitor.libcamera.rules = [
  { matches = [ { api.libcamera.path = "~.*cci@ac4a000/i2c-bus@1/camera@10" } ]
    actions = { update-props = { node.description = "Main Camera (64MP)", node.nick = "Main" } } }
  { matches = [ { api.libcamera.path = "~.*cci@ac4b000/i2c-bus@1/camera@1a" } ]
    actions = { update-props = { node.description = "Ultrawide Camera (8MP)", node.nick = "Ultrawide" } } }
  { matches = [ { api.libcamera.path = "~.*cci@ac4b000/i2c-bus@0/camera@2d" } ]
    actions = { update-props = { node.description = "Macro Camera (5MP)", node.nick = "Macro" } } }
  { matches = [ { api.libcamera.path = "~.*cci@ac4a000/i2c-bus@0/camera@10" } ]
    actions = { update-props = { node.description = "Front Camera (20MP)", node.nick = "Front" } } }
]
